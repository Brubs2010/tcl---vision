name: Build TCL Vision APK

on:
  push:
    branches:
      - redesign/tcl-vision-home
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Extrair projeto Android
        run: |
          unzip -q TCL-Vision-Android-autorizacao-nativa-corrigido.zip -d android-temp
          PROJECT=$(find android-temp -name settings.gradle -printf '%h\n' | head -n 1)
          echo "PROJECT_DIR=$PROJECT" >> $GITHUB_ENV

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: TCL-Vision-APK
          path: android-temp/**/build/outputs/apk/debug/*.apk
